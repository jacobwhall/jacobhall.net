[package]
name = "jacobhall-net"
version = "0.1.0"
edition = "2021"
description = "Jacob Hall's website"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "macros",
    "migrate",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
scraper = "0.27.0"
sha2 = "0.11.0"
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
reqwest = { version = "0.13.4", features = ["form", "gzip"] }

[profile.release]
lto = true
codegen-units = 1
