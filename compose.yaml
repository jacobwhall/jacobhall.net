# Local development environment: the Rust server + PostgreSQL.
#
#   docker compose up --build --watch
#
# Site:     http://127.0.0.1:8000
# Postgres: postgres://jacobhall:devpassword@127.0.0.1:5434/jacobhall
#           (handy for psql, or for running the server on the host with
#            plain `cargo run` against the same database)
#
# The FIRST start initializes Postgres from server/db/schema-baseline.sql +
# server/db/data.sql into ./.dev-data/postgres (gitignored, persists between
# sessions). data.sql is a production dump and is NOT in git — on a fresh
# clone, place one at server/db/data.sql before the first `up` (otherwise
# Docker will create an empty directory at that path and Postgres will start
# with the schema but no data). To reset the database from the dumps again:
#   docker compose down && sudo rm -rf .dev-data && docker compose up
# (sudo because the data files belong to the postgres container's uid.)
#
# sqlx migrations run automatically (the one-shot `migrate` service) before
# the server starts.
#
# Live reload: the server image is built with the dev-reload feature, so
# open browser tabs refresh by themselves. The repo is mounted read-only as
# the docroot; edits to content, styles, and templates reload the page
# immediately. With --watch, Rust changes (server/src, Cargo.toml,
# migrations) rebuild and restart the server container, and the page reloads
# once it's back. Without --watch, use `docker compose up --build` for those.
# The image uses the unoptimized dev-container profile; production images are
# built from server/Dockerfile with its defaults (release, no dev-reload).
#
# Faster Rust iteration: run only the database here and the server on the
# host, from the repo root (needs `cargo install watchexec-cli`):
#   docker compose up -d db
#   DATABASE_URL=postgres://jacobhall:devpassword@127.0.0.1:5434/jacobhall \
#     watchexec -r -w server/src -w server/Cargo.toml -- \
#     cargo run --manifest-path server/Cargo.toml --features dev-reload -- serve

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jacobhall
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: jacobhall
    volumes:
      - ./.dev-data/postgres:/var/lib/postgresql/data:Z
      - ./server/db/schema-baseline.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,z
      - ./server/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro,z
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jacobhall -d jacobhall"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations and exits. Separate from `server` because the
  # distroless image has no shell to chain `migrate && serve`.
  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      # No baked-in content; the working tree is mounted as the docroot.
      target: server
      args:
        CARGO_PROFILE: dev-container
        CARGO_FEATURES: dev-reload
    develop:
      watch:
        - path: server/src
          action: rebuild
        - path: server/Cargo.toml
          action: rebuild
        - path: server/Cargo.lock
          action: rebuild
        - path: server/migrations
          action: rebuild
    command: ["/usr/local/bin/jacobhall-net", "migrate"]
    environment:
      DATABASE_URL: postgres://jacobhall:devpassword@db:5432/jacobhall
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      # No baked-in content; the working tree is mounted as the docroot.
      target: server
      args:
        CARGO_PROFILE: dev-container
        CARGO_FEATURES: dev-reload
    develop:
      watch:
        - path: server/src
          action: rebuild
        - path: server/Cargo.toml
          action: rebuild
        - path: server/Cargo.lock
          action: rebuild
        - path: server/migrations
          action: rebuild
    environment:
      DATABASE_URL: postgres://jacobhall:devpassword@db:5432/jacobhall
      BIND_ADDR: 0.0.0.0:8000
      DOCROOT: /site
      TEMPLATES_DIR: /site/server/templates
      BASE_URL: https://jacobhall.net
      RUST_LOG: info
      # Uncomment to use the /admin moderation area locally:
      ADMIN_PASSWORD: dev-admin
      COOKIE_KEY: local-development-cookie-key-0123456789
    volumes:
      - .:/site:ro,z
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
