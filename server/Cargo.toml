[package]
name = "jacobhall-net"
version = "0.1.0"
edition = "2021"
description = "Jacob Hall's website"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "macros",
    "migrate",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
scraper = "0.27.0"
sha2 = "0.11.0"
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
reqwest = { version = "0.13.4", features = ["form", "gzip"] }
webpki-root-certs = "1"
tower-livereload = { version = "0.10.3", optional = true }
notify = { version = "8.2.0", optional = true }

# musl's allocator is slow under tokio's multi-threaded load; the Docker
# image is a static musl build, so swap in mimalloc there.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Fast incremental builds for the compose dev stack, so `docker compose up
# --watch` rebuilds after Rust edits don't wait on release LTO.
[profile.dev-container]
inherits = "dev"

[features]
# Development-only: browser live reload on content/template/style changes.
# Never enable for production builds (it injects a script into every HTML
# page). compose.yaml turns it on via the Dockerfile's CARGO_FEATURES arg.
dev-reload = ["dep:tower-livereload", "dep:notify"]
